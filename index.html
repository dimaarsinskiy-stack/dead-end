<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #111; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Игрок
        let player = { x: canvas.width / 2, y: canvas.height / 2, size: 30, angle: 0 };
        let bullets = [];
        
        // Враг
        let enemy = { x: canvas.width / 2, y: 150, size: 30, health: 5, alive: true };

        // Настройки джойстиков
        let joyRadius = 50;
        let moveJoy = { x: 100, y: canvas.height - 100, active: false, id: null, angle: 0 };
        let aimJoy = { x: canvas.width - 100, y: canvas.height - 100, active: false, id: null, angle: 0 };

        // Обработка касаний
        canvas.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                // Если касание в левой нижней четверти — это левый джойстик
                if (touch.clientX < canvas.width / 2 && touch.clientY > canvas.height / 2) {
                    moveJoy.id = touch.identifier;
                    moveJoy.active = true;
                }
                // Если в правой нижней — правый джойстик
                else if (touch.clientX > canvas.width / 2 && touch.clientY > canvas.height / 2) {
                    aimJoy.id = touch.identifier;
                    aimJoy.active = true;
                }
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveJoy.id) {
                    let dx = touch.clientX - moveJoy.x;
                    let dy = touch.clientY - moveJoy.y;
                    moveJoy.angle = Math.atan2(dy, dx);
                    // Движение игрока, если джойстик отклонен
                    if (Math.hypot(dx, dy) > 10) {
                        player.x += Math.cos(moveJoy.angle) * 4;
                        player.y += Math.sin(moveJoy.angle) * 4;
                    }
                }
                if (touch.identifier === aimJoy.id) {
                    let dx = touch.clientX - aimJoy.x;
                    let dy = touch.clientY - aimJoy.y;
                    aimJoy.angle = Math.atan2(dy, dx);
                    // Поворот игрока за правым джойстиком
                    player.angle = aimJoy.angle;
                    // Автоматическая стрельба
                    if (Math.hypot(dx, dy) > 10) {
                        shoot();
                    }
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveJoy.id) {
                    moveJoy.active = false;
                    moveJoy.id = null;
                }
                if (touch.identifier === aimJoy.id) {
                    aimJoy.active = false;
                    aimJoy.id = null;
                }
            }
        });

        let shootCooldown = 0;
        function shoot() {
            if (shootCooldown > 0) return;
            bullets.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(player.angle) * 15,
                vy: Math.sin(player.angle) * 15
            });
            shootCooldown = 10; // Задержка между выстрелами
        }

        function drawJoystick(joy) {
            // Внешний круг
            ctx.beginPath();
            ctx.arc(joy.x, joy.y, joyRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();
            // Внутренняя палочка (визуально)
            if (joy.active) {
                ctx.beginPath();
                ctx.moveTo(joy.x, joy.y);
                ctx.lineTo(joy.x + Math.cos(joy.angle) * joyRadius, joy.y + Math.sin(joy.angle) * joyRadius);
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        function gameLoop() {
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Стены
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);

            if (shootCooldown > 0) shootCooldown--;

            // Враг
            if (enemy.alive) {
                ctx.fillStyle = '#d32f2f';
                ctx.fillRect(enemy.x - enemy.size/2, enemy.y - enemy.size/2, enemy.size, enemy.size);
                // Полоска здоровья
                ctx.fillStyle = 'red';
                ctx.fillRect(enemy.x - 25, enemy.y - 30, enemy.health * 10, 5);
            } else {
                ctx.fillStyle = '#b71c1c';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, 40, 0, Math.PI * 2);
                ctx.fill();
            }

            // Рисуем игрока
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
            ctx.fillStyle = '#a67c52';
            ctx.fillRect(0, -player.size/4, player.size/2, player.size/2);
            ctx.restore();

            // Пули
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();

                if (enemy.alive && b.x > enemy.x - enemy.size/2 && b.x < enemy.x + enemy.size/2 &&
                    b.y > enemy.y - enemy.size/2 && b.y < enemy.y + enemy.size/2) {
                    enemy.health--;
                    if (enemy.health <= 0) enemy.alive = false;
                    bullets.splice(i, 1); 
                    continue;
                }

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // Отрисовка джойстиков
            drawJoystick(moveJoy);
            drawJoystick(aimJoy);

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
