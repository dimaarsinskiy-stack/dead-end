<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #fireBtn { position: absolute; bottom: 40px; right: 40px; width: 70px; height: 70px; background: rgba(255,0,0,0.4); border: 3px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-family: Arial; font-weight: bold; font-size: 18px; user-select: none; }
        /* Джойстик */
        #joyBase { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; border: 3px solid rgba(255,255,255,0.4); border-radius: 50%; display: none; }
        #joyStick { position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="fireBtn">FIRE</div>
    <div id="joyBase"><div id="joyStick"></div></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- 3D СЦЕНА ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas') });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Свет
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1, 1, 1); scene.add(dirLight);

        // Пол и стены
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        scene.add(new THREE.Mesh(new THREE.BoxGeometry(100, 10, 1), wallMat).translateZ(-50));
        scene.add(new THREE.Mesh(new THREE.BoxGeometry(100, 10, 1), wallMat).translateZ(50));
        scene.add(new THREE.Mesh(new THREE.BoxGeometry(1, 10, 100), wallMat).translateX(-50));
        scene.add(new THREE.Mesh(new THREE.BoxGeometry(1, 10, 100), wallMat).translateX(50));

        // Враги
        const enemies = [];
        const enemyGeo = new THREE.BoxGeometry(2, 2, 2);
        const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        for (let i = 0; i < 5; i++) {
            const e = new THREE.Mesh(enemyGeo, enemyMat);
            e.position.set((Math.random() - 0.5) * 40, 1, (Math.random() - 0.5) * 40);
            scene.add(e); enemies.push(e);
        }

        // Оружие (вид от первого лица)
        const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.5), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        gun.position.set(0.3, -0.2, -0.6);
        camera.add(gun); scene.add(camera);

        // --- ПУЛИ ---
        const bullets = [];
        const bulletGeo = new THREE.SphereGeometry(0.1, 8, 8);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });

        // --- УПРАВЛЕНИЕ ---
        let yaw = 0, pitch = 0;
        let moveX = 0, moveY = 0;
        let touchId = null;
        let joyTouchId = null;

        // Свайп для поворота (правая сторона)
        document.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.clientX > window.innerWidth / 2 && touch.clientX < window.innerWidth - 100) {
                    touchId = touch.identifier;
                }
            }
        });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                if (touch.identifier === touchId) {
                    let dx = touch.movementX || 0;
                    let dy = touch.movementY || 0;
                    // Если movementX не работает, считаем вручную
                    if (dx === 0) {
                        dx = touch.clientX - (touch.prevX || touch.clientX);
                        dy = touch.clientY - (touch.prevY || touch.clientY);
                        touch.prevX = touch.clientX;
                        touch.prevY = touch.clientY;
                    }
                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitch));
                }
            }
        });

        document.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === touchId) touchId = null;
            }
        });

        // Джойстик (левая сторона)
        const joyBase = document.getElementById('joyBase');
        const joyStick = document.getElementById('joyStick');
        let joyActive = false;

        document.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.clientX < window.innerWidth / 2 && touch.clientY > window.innerHeight / 2) {
                    joyActive = true;
                    joyTouchId = touch.identifier;
                    joyBase.style.display = 'block';
                    joyBase.style.left = (touch.clientX - 60) + 'px';
                    joyBase.style.top = (touch.clientY - 60) + 'px';
                }
            }
        });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    let baseRect = joyBase.getBoundingClientRect();
                    let centerX = baseRect.left + 60;
                    let centerY = baseRect.top + 60;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    let dist = Math.min(Math.hypot(dx, dy), 50);
                    let angle = Math.atan2(dy, dx);
                    
                    joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                    
                    // Нормализованное движение
                    moveX = Math.cos(angle) * (dist / 50);
                    moveY = Math.sin(angle) * (dist / 50);
                }
            }
        });

        document.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    joyActive = false;
                    joyTouchId = null;
                    joyBase.style.display = 'none';
                    joyStick.style.transform = `translate(-50%, -50%)`;
                    moveX = 0; moveY = 0;
                }
            }
        });

        // Стрельба
        const fireBtn = document.getElementById('fireBtn');
        fireBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            
            // Создаем пулю
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.position.copy(camera.position);
            
            const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            bullet.velocity = direction.multiplyScalar(1);
            
            scene.add(bullet);
            bullets.push(bullet);
        });

        // Анимация
        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Движение через джойстик
            if (joyActive) {
                const speed = 0.2;
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                
                camera.position.add(forward.multiplyScalar(moveY * speed));
                camera.position.add(right.multiplyScalar(moveX * speed));
            }

            // Ограничение стен
            camera.position.x = Math.max(-49, Math.min(49, camera.position.x));
            camera.position.z = Math.max(-49, Math.min(49, camera.position.z));
            camera.position.y = 1.6;

            // Движение пуль
            bullets.forEach((b, i) => {
                b.position.add(b.velocity);
                // Проверка попадания
                enemies.forEach(e => {
                    if (b.position.distanceTo(e.position) < 1.5) {
                        scene.remove(e);
                        scene.remove(b);
                        enemies.splice(enemies.indexOf(e), 1);
                        bullets.splice(i, 1);
                    }
                });
                // Удаление пуль
                if (b.position.length() > 200) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
