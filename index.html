<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #111; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: canvas.width / 2, y: canvas.height / 2, size: 30, angle: 0, hasWeapon: false };
        let bullets = [];
        let enemy = { x: canvas.width / 2, y: 150, size: 30, state: 'alive', health: 1 };

        // Плавающий левый джойстик
        let moveJoy = { active: false, id: null, startX: 0, startY: 0, curX: 0, curY: 0, angle: 0, dist: 0 };
        // Правый джойстик (прицел)
        let aimJoy = { x: canvas.width - 120, y: canvas.height - 120, active: false, id: null, angle: 0, dist: 0 };

        // Кнопки как в порте: FAR, +, 3
        let btnFar = { x: canvas.width - 220, y: canvas.height - 70, radius: 30, pressed: false };
        let btnPlus = { x: canvas.width - 70, y: canvas.height - 70, radius: 40, pressed: false };
        let btnThree = { x: canvas.width - 140, y: canvas.height - 140, radius: 30, pressed: false };

        canvas.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.clientX < canvas.width / 2) {
                    if (!moveJoy.active) {
                        moveJoy.id = touch.identifier; moveJoy.active = true;
                        moveJoy.startX = touch.clientX; moveJoy.startY = touch.clientY;
                        moveJoy.curX = touch.clientX; moveJoy.curY = touch.clientY;
                    }
                } else {
                    // FAR
                    if (Math.hypot(touch.clientX - btnFar.x, touch.clientY - btnFar.y) < btnFar.radius) {
                        btnFar.pressed = true;
                        // FAR переключает режим (пока просто визуально)
                        continue;
                    }
                    // +
                    if (Math.hypot(touch.clientX - btnPlus.x, touch.clientY - btnPlus.y) < btnPlus.radius) {
                        btnPlus.pressed = true;
                        if (player.hasWeapon) {
                            shoot();
                        } else {
                            if (enemy.state === 'alive' && Math.hypot(player.x - enemy.x, player.y - enemy.y) < 70) {
                                enemy.state = 'downed';
                            } else if (enemy.state === 'downed' && Math.hypot(player.x - enemy.x, player.y - enemy.y) < 70) {
                                enemy.state = 'dead';
                            }
                        }
                        continue;
                    }
                    // 3
                    if (Math.hypot(touch.clientX - btnThree.x, touch.clientY - btnThree.y) < btnThree.radius) {
                        btnThree.pressed = true;
                        player.hasWeapon = false; // Выбросить
                        continue;
                    }
                    // Прицел
                    if (!aimJoy.active) {
                        aimJoy.id = touch.identifier; aimJoy.active = true;
                    }
                }
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveJoy.id) {
                    moveJoy.curX = touch.clientX; moveJoy.curY = touch.clientY;
                    let dx = moveJoy.curX - moveJoy.startX;
                    let dy = moveJoy.curY - moveJoy.startY;
                    moveJoy.angle = Math.atan2(dy, dx);
                    moveJoy.dist = Math.min(Math.hypot(dx, dy), 60);
                    if (moveJoy.dist > 15) {
                        player.x += Math.cos(moveJoy.angle) * 5;
                        player.y += Math.sin(moveJoy.angle) * 5;
                        player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
                        player.y = Math.max(20, Math.min(canvas.height - 20, player.y));
                    }
                }
                if (touch.identifier === aimJoy.id) {
                    let dx = touch.clientX - aimJoy.x;
                    let dy = touch.clientY - aimJoy.y;
                    aimJoy.angle = Math.atan2(dy, dx);
                    aimJoy.dist = Math.min(Math.hypot(dx, dy), 60);
                    player.angle = aimJoy.angle;
                    if (aimJoy.dist > 15 && player.hasWeapon) shoot();
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveJoy.id) { moveJoy.active = false; moveJoy.id = null; moveJoy.dist = 0; }
                if (touch.identifier === aimJoy.id) { aimJoy.active = false; aimJoy.id = null; aimJoy.dist = 0; }
                btnFar.pressed = false; btnPlus.pressed = false; btnThree.pressed = false;
            }
        });

        let shootCooldown = 0;
        function shoot() {
            if (shootCooldown > 0) return;
            bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.angle) * 15, vy: Math.sin(player.angle) * 15 });
            shootCooldown = 8;
        }

        function gameLoop() {
            ctx.fillStyle = '#222'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#555'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
            if (shootCooldown > 0) shootCooldown--;

            // Враг
            if (enemy.state === 'alive') {
                ctx.fillStyle = '#d32f2f'; ctx.fillRect(enemy.x - 15, enemy.y - 15, 30, 30);
            } else if (enemy.state === 'downed') {
                ctx.fillStyle = '#b71c1c'; ctx.fillRect(enemy.x - 30, enemy.y - 7, 60, 15);
            } else {
                ctx.fillStyle = '#4a0000'; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, 40, 0, Math.PI * 2); ctx.fill();
            }

            // Игрок
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
            ctx.fillStyle = '#fff'; ctx.fillRect(-15, -15, 30, 30);
            ctx.fillStyle = '#a67c52'; ctx.fillRect(0, -7, 15, 15);
            if (player.hasWeapon) { ctx.fillStyle = 'gray'; ctx.fillRect(15, -5, 20, 10); }
            ctx.restore();

            // Пули
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy;
                ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
                if (enemy.state === 'alive' && b.x > enemy.x - 15 && b.x < enemy.x + 15 && b.y > enemy.y - 15 && b.y < enemy.y + 15) {
                    enemy.state = 'dead'; bullets.splice(i, 1); continue;
                }
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
            }

            // Левый джойстик
            if (moveJoy.active) {
                ctx.beginPath(); ctx.arc(moveJoy.startX, moveJoy.startY, 60, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 4; ctx.stroke();
                let sx = moveJoy.startX + Math.cos(moveJoy.angle) * moveJoy.dist;
                let sy = moveJoy.startY + Math.sin(moveJoy.angle) * moveJoy.dist;
                ctx.beginPath(); ctx.arc(sx, sy, 25, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
            }

            // Правый джойстик
            ctx.beginPath(); ctx.arc(aimJoy.x, aimJoy.y, 60, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 4; ctx.stroke();
            let ax = aimJoy.x + Math.cos(aimJoy.angle) * aimJoy.dist;
            let ay = aimJoy.y + Math.sin(aimJoy.angle) * aimJoy.dist;
            ctx.beginPath(); ctx.arc(ax, ay, 25, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();

            // Кнопки
            const drawBtn = (b, label, color) => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.pressed ? 'rgba(255,0,0,0.6)' : color;
                ctx.fill(); ctx.strokeStyle = 'white'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = 'white'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
                ctx.fillText(label, b.x, b.y + 5);
            };
            drawBtn(btnFar, 'FAR', 'rgba(100,100,255,0.3)');
            drawBtn(btnPlus, '+', 'rgba(255,255,255,0.2)');
            drawBtn(btnThree, '3', 'rgba(255,255,0,0.3)');

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
