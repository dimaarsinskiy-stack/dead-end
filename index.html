<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #111; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: canvas.width / 2, y: canvas.height / 2, size: 30, angle: 0 };
        let bullets = [];
        
        let moveTouch = null;
        let aimTouch = null;
        let shootTimer = 0;

        canvas.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.clientX < canvas.width / 2) {
                    moveTouch = { id: touch.identifier, lastX: touch.clientX, lastY: touch.clientY };
                } else {
                    aimTouch = { id: touch.identifier, x: touch.clientX, y: touch.clientY };
                }
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (moveTouch && touch.identifier === moveTouch.id) {
                    let dx = touch.clientX - moveTouch.lastX;
                    let dy = touch.clientY - moveTouch.lastY;
                    player.x += dx * 0.2;
                    player.y += dy * 0.2;
                    // Ограничение экрана
                    player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
                    player.y = Math.max(20, Math.min(canvas.height - 20, player.y));
                    moveTouch.lastX = touch.clientX;
                    moveTouch.lastY = touch.clientY;
                }
                if (aimTouch && touch.identifier === aimTouch.id) {
                    aimTouch.x = touch.clientX;
                    aimTouch.y = touch.clientY;
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (moveTouch && touch.identifier === moveTouch.id) moveTouch = null;
                if (aimTouch && touch.identifier === aimTouch.id) aimTouch = null;
            }
        });

        function shoot() {
            if (!aimTouch) return;
            let dx = aimTouch.x - player.x;
            let dy = aimTouch.y - player.y;
            let dist = Math.hypot(dx, dy);
            if (dist === 0) return;
            bullets.push({
                x: player.x,
                y: player.y,
                vx: (dx / dist) * 10,
                vy: (dy / dist) * 10
            });
        }

        function gameLoop() {
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#444';
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // Поворот персонажа в сторону прицела (как в ХЛМ)
            if (aimTouch) {
                let dx = aimTouch.x - player.x;
                let dy = aimTouch.y - player.y;
                player.angle = Math.atan2(dy, dx);
            }

            // Рисуем персонажа (с учетом поворота)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
            // Картонная маска спереди
            ctx.fillStyle = '#a67c52';
            ctx.fillRect(0, -player.size/4, player.size/2, player.size/2);
            ctx.restore();

            // Стрельба с задержкой
            shootTimer++;
            if (aimTouch && shootTimer > 10) {
                shoot();
                shootTimer = 0;
            }

            // Рисуем пули
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();

                // Удаляем пули за экраном
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // Красная линия прицела
            if (aimTouch) {
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(aimTouch.x, aimTouch.y);
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
