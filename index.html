<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        /* Кнопки */
        #fireBtn { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(255,0,0,0.4); border: 3px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-family: Arial; font-weight: bold; font-size: 18px; user-select: none; }
        #fireBtn:active { background: rgba(255,0,0,0.8); }
        
        #jumpBtn { position: absolute; bottom: 130px; right: 40px; width: 60px; height: 60px; background: rgba(0,255,0,0.4); border: 3px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-family: Arial; font-weight: bold; font-size: 14px; user-select: none; }
        #jumpBtn:active { background: rgba(0,255,0,0.8); }

        /* Джойстик */
        #joyBase { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; display: none; background: rgba(0,0,0,0.3); }
        #joyStick { position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
    <!-- Подключаем движок Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="fireBtn">FIRE</div>
    <div id="jumpBtn">JUMP</div>
    <div id="joyBase"><div id="joyStick"></div></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- НАСТРОЙКА 3D ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6; // Высота глаз
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Ограничение пикселей для FPS

        // --- СВЕТ ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        // --- КАРТА (Пол и стены) ---
        const grid = new THREE.GridHelper(100, 20, 0x555555, 0x222222);
        scene.add(grid);

        const wallMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
        const wallGeo = new THREE.BoxGeometry(100, 10, 2);
        
        const wall1 = new THREE.Mesh(wallGeo, wallMat); wall1.position.set(0, 5, -50); scene.add(wall1);
        const wall2 = new THREE.Mesh(wallGeo, wallMat); wall2.position.set(0, 5, 50); scene.add(wall2);
        const wall3 = new THREE.Mesh(new THREE.BoxGeometry(2, 10, 100), wallMat); wall3.position.set(-50, 5, 0); scene.add(wall3);
        const wall4 = new THREE.Mesh(new THREE.BoxGeometry(2, 10, 100), wallMat); wall4.position.set(50, 5, 0); scene.add(wall4);

        // --- ВРАГИ ---
        const enemies = [];
        const enemyGeo = new THREE.BoxGeometry(2, 2, 2);
        const enemyMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        function spawnEnemy() {
            const e = new THREE.Mesh(enemyGeo, enemyMat);
            e.position.set((Math.random() - 0.5) * 80, 1, (Math.random() - 0.5) * 80);
            scene.add(e); enemies.push(e);
        }
        for (let i = 0; i < 10; i++) spawnEnemy();

        // --- ОРУЖИЕ ---
        const gun = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.6), new THREE.MeshBasicMaterial({ color: 0x222222 }));
        gun.position.set(0.3, -0.3, -0.6);
        camera.add(gun);
        scene.add(camera);

        // --- ФИЗИКА И УПРАВЛЕНИЕ ---
        let yaw = 0, pitch = 0;
        let moveX = 0, moveY = 0;
        let velocityY = 0;
        let isGrounded = true;
        let joyActive = false, joyTouchId = null;
        let lookTouchId = null, lastLookX = 0, lastLookY = 0;

        const joyBase = document.getElementById('joyBase');
        const joyStick = document.getElementById('joyStick');

        // Обработка касаний
        document.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                let x = touch.clientX, y = touch.clientY;
                
                // Левый нижний угол — джойстик
                if (x < window.innerWidth / 2 && y > window.innerHeight / 2) {
                    if (!joyActive) {
                        joyActive = true; joyTouchId = touch.identifier;
                        joyBase.style.display = 'block';
                        joyBase.style.left = (x - 60) + 'px';
                        joyBase.style.top = (y - 60) + 'px';
                    }
                } 
                // Остальная часть экрана — обзор
                else if (x > 100 && x < window.innerWidth - 120) {
                    if (lookTouchId === null) {
                        lookTouchId = touch.identifier;
                        lastLookX = x; lastLookY = y;
                    }
                }
            }
        });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                // Движение джойстика
                if (touch.identifier === joyTouchId) {
                    let baseRect = joyBase.getBoundingClientRect();
                    let centerX = baseRect.left + 60;
                    let centerY = baseRect.top + 60;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    let dist = Math.min(Math.hypot(dx, dy), 50);
                    let angle = Math.atan2(dy, dx);

                    joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                    
                    // Жестко: вверх = вперед
                    moveX = Math.cos(angle) * (dist / 50);
                    moveY = Math.sin(angle) * (dist / 50); 
                }
                // Вращение камеры
                if (touch.identifier === lookTouchId) {
                    let dx = touch.clientX - lastLookX;
                    let dy = touch.clientY - lastLookY;
                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
                    lastLookX = touch.clientX; lastLookY = touch.clientY;
                }
            }
        });

        document.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    joyActive = false; joyTouchId = null;
                    joyBase.style.display = 'none';
                    moveX = 0; moveY = 0;
                }
                if (touch.identifier === lookTouchId) lookTouchId = null;
            }
        });

        // Кнопка прыжка
        document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGrounded) { velocityY = 6; isGrounded = false; }
        });

        // Кнопка выстрела
        const bullets = [];
        const bulletGeo = new THREE.SphereGeometry(0.1, 8, 8);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });

        document.getElementById('fireBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.position.copy(camera.position);
            
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            bullet.velocity = dir.multiplyScalar(1.5);
            
            scene.add(bullet);
            bullets.push(bullet);
        });

        // --- ИГРОВОЙ ЦИКЛ ---
        function animate() {
            requestAnimationFrame(animate);

            // Поворот камеры
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Движение
            if (joyActive) {
                const speed = 0.15;
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                
                // Джойстик
                camera.position.add(forward.multiplyScalar(-moveY * speed));
                camera.position.add(right.multiplyScalar(moveX * speed));
            }

            // Прыжок (гравитация)
            camera.position.y += velocityY * 0.05;
            velocityY -= 0.3;
            if (camera.position.y <= 1.6) {
                camera.position.y = 1.6;
                velocityY = 0;
                isGrounded = true;
            }

            // Ограничения карты
            camera.position.x = Math.max(-48, Math.min(48, camera.position.x));
            camera.position.z = Math.max(-48, Math.min(48, camera.position.z));

            // Пули
            bullets.forEach((b, i) => {
                b.position.add(b.velocity);
                enemies.forEach(e => {
                    if (b.position.distanceTo(e.position) < 1.5) {
                        scene.remove(e);
                        enemies.splice(enemies.indexOf(e), 1);
                        scene.remove(b);
                        bullets.splice(i, 1);
                    }
                });
                if (b.position.length() > 100) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
