<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Жёсткая ориентация для WebView */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; background: #111; }
        @media screen and (orientation: portrait) {
            canvas {
                width: 100vh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: bottom left;
                position: absolute;
                top: -100vw;
                left: 0;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- ГЛОБАЛЬНЫЕ РАЗМЕРЫ ---
        let W = window.innerWidth;
        let H = window.innerHeight;
        if (H > W) { let temp = W; W = H; H = temp; }
        canvas.width = W;
        canvas.height = H;

        // --- ИГРОК ---
        let player = { x: 100, y: 100, size: 30, angle: 0, speed: 5, health: 3, hasWeapon: false };
        
        // --- ОРУЖИЕ И ВРАГИ ---
        let bullets = [];
        let enemies = [];
        let items = [];
        let bloodParticles = [];
        let storyText = "Уровень 1: Общага. Сосед стучит по батареям.";
        let storyTimer = 300;

        // --- УПРАВЛЕНИЕ ---
        let moveStick = { active: false, id: null, sx: 0, sy: 0, cx: 0, cy: 0, dx: 0, dy: 0 };
        let aimStick = { active: false, id: null, cx: W - 140, cy: H - 140, dx: 0, dy: 0, radius: 70 };
        
        // Кнопки
        let btnFire = { x: W - 80, y: H - 80, radius: 50, pressed: false };
        let btnThrow = { x: W - 170, y: H - 170, radius: 35, pressed: false };
        let btnExec = { x: W - 280, y: H - 80, radius: 40, pressed: false };
        let btnAuto = { x: W - 280, y: H - 180, radius: 35, pressed: false, active: false };
        let btnLook = { x: W - 80, y: H - 250, radius: 35, pressed: false };
        let btnRestart = { x: 40, y: 40, radius: 30, pressed: false };
        let shootCooldown = 0;

        // --- КАМЕРА ---
        let camera = { x: 0, y: 0 };
        let screenShake = 0;

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function initLevel() {
            bullets = []; items = []; bloodParticles = []; enemies = [];
            player.x = 100; player.y = H/2; player.health = 3; player.hasWeapon = false;
            btnAuto.active = false;
            
            // Стены (простая комната)
            // Враг (Сосед)
            enemies.push({ x: W - 150, y: H/2, state: 'alive', health: 1, angle: Math.PI });
            storyTimer = 300;
        }

        // --- ОБРАБОТКА КАСАНИЙ (МУЛЬТИТАЧ) ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                let x = touch.clientX, y = touch.clientY;

                if (Math.hypot(x - btnRestart.x, y - btnRestart.y) < btnRestart.radius) { initLevel(); continue; }
                if (Math.hypot(x - btnFire.x, y - btnFire.y) < btnFire.radius) { btnFire.pressed = true; continue; }
                if (Math.hypot(x - btnThrow.x, y - btnThrow.y) < btnThrow.radius) { btnThrow.pressed = true; continue; }
                if (Math.hypot(x - btnExec.x, y - btnExec.y) < btnExec.radius) { btnExec.pressed = true; continue; }
                if (Math.hypot(x - btnLook.x, y - btnLook.y) < btnLook.radius) { btnLook.pressed = true; continue; }
                if (Math.hypot(x - btnAuto.x, y - btnAuto.y) < btnAuto.radius) { btnAuto.pressed = true; btnAuto.active = !btnAuto.active; continue; }

                if (x < W / 2 && !moveStick.active) {
                    moveStick.active = true; moveStick.id = touch.identifier;
                    moveStick.sx = x; moveStick.sy = y; moveStick.cx = x; moveStick.cy = y;
                } else if (x >= W / 2 && !aimStick.active) {
                    aimStick.active = true; aimStick.id = touch.identifier;
                }
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveStick.id) {
                    moveStick.cx = touch.clientX; moveStick.cy = touch.clientY;
                    let dx = moveStick.cx - moveStick.sx, dy = moveStick.cy - moveStick.sy;
                    let dist = Math.min(Math.hypot(dx, dy), 60);
                    moveStick.dx = Math.cos(Math.atan2(dy, dx)) * (dist / 60);
                    moveStick.dy = Math.sin(Math.atan2(dy, dx)) * (dist / 60);
                }
                if (touch.identifier === aimStick.id) {
                    let dx = touch.clientX - aimStick.cx, dy = touch.clientY - aimStick.cy;
                    let dist = Math.min(Math.hypot(dx, dy), aimStick.radius);
                    aimStick.dx = Math.cos(Math.atan2(dy, dx)) * (dist / aimStick.radius);
                    aimStick.dy = Math.sin(Math.atan2(dy, dx)) * (dist / aimStick.radius);
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveStick.id) { moveStick.active = false; moveStick.id = null; moveStick.dx = 0; moveStick.dy = 0; }
                if (touch.identifier === aimStick.id) { aimStick.active = false; aimStick.id = null; aimStick.dx = 0; aimStick.dy = 0; }
                btnFire.pressed = false; btnThrow.pressed = false; btnExec.pressed = false; btnLook.pressed = false; btnAuto.pressed = false;
            }
        });

        function createBlood(x, y) {
            for (let i = 0; i < 15; i++) bloodParticles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 60 });
            screenShake = 10;
        }

        function update() {
            if (storyTimer > 0) storyTimer--;
            if (screenShake > 0) screenShake--;

            // Движение
            player.x += moveStick.dx * player.speed;
            player.y += moveStick.dy * player.speed;
            player.x = Math.max(20, Math.min(W - 20, player.x));
            player.y = Math.max(20, Math.min(H - 20, player.y));

            // Прицел
            if (aimStick.active) player.angle = Math.atan2(aimStick.dy, aimStick.dx);

            // Авто-прицел
            if (btnAuto.active && enemies.length > 0) {
                let target = enemies.find(e => e.state === 'alive');
                if (target) {
                    player.angle = Math.atan2(target.y - player.y, target.x - player.x);
                    aimStick.dx = Math.cos(player.angle); aimStick.dy = Math.sin(player.angle);
                }
            }

            // Атака
            if (btnFire.pressed) {
                if (player.hasWeapon && shootCooldown <= 0) {
                    bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.angle)*20, vy: Math.sin(player.angle)*20 });
                    shootCooldown = 10;
                } else if (!player.hasWeapon) {
                    enemies.forEach(e => {
                        if (e.state === 'alive' && Math.hypot(e.x - player.x, e.y - player.y) < 60) e.state = 'downed';
                    });
                }
            }
            if (shootCooldown > 0) shootCooldown--;

            // Добивание
            if (btnExec.pressed) {
                let downed = enemies.find(e => e.state === 'downed' && Math.hypot(e.x - player.x, e.y - player.y) < 60);
                if (downed) { downed.state = 'dead'; createBlood(downed.x, downed.y); }
            }

            // Бросок/Подбор
            if (btnThrow.pressed) {
                if (player.hasWeapon) { player.hasWeapon = false; items.push({ x: player.x, y: player.y }); }
                else {
                    let item = items.find(i => Math.hypot(i.x - player.x, i.y - player.y) < 50);
                    if (item) { player.hasWeapon = true; items.splice(items.indexOf(item), 1); }
                }
            }

            // Пули
            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy;
                enemies.forEach(e => {
                    if (e.state === 'alive' && Math.hypot(b.x - e.x, b.y - e.y) < 20) { e.state = 'dead'; createBlood(e.x, e.y); bullets.splice(i, 1); }
                });
                if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) bullets.splice(i, 1);
            });

            // Кровь
            bloodParticles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) bloodParticles.splice(i, 1); });

            // Камера
            camera.x = player.x - W/2;
            camera.y = player.y - H/2;
        }

        function draw() {
            ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
            
            let shakeX = screenShake > 0 ? (Math.random()-0.5)*10 : 0;
            let shakeY = screenShake > 0 ? (Math.random()-0.5)*10 : 0;

            ctx.save();
            ctx.translate(-camera.x + shakeX, -camera.y + shakeY);

            // Кровь
            bloodParticles.forEach(p => { ctx.fillStyle = '#b71c1c'; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); });

            // Враги
            enemies.forEach(e => {
                if (e.state === 'alive') { ctx.fillStyle = '#d32f2f'; ctx.fillRect(e.x-15, e.y-15, 30, 30); }
                else if (e.state === 'downed') { ctx.fillStyle = '#b71c1c'; ctx.fillRect(e.x-30, e.y-7, 60, 15); }
            });

            // Игрок
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
            ctx.fillStyle = '#fff'; ctx.fillRect(-15, -15, 30, 30);
            ctx.fillStyle = '#a67c52'; ctx.fillRect(0, -7, 15, 15);
            if (player.hasWeapon) { ctx.fillStyle = 'gray'; ctx.fillRect(15, -5, 20, 10); }
            ctx.restore();

            // Пули
            bullets.forEach(b => { ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });

            ctx.restore();

            // --- ИНТЕРФЕЙС ---
            if (moveStick.active) {
                ctx.beginPath(); ctx.arc(moveStick.sx, moveStick.sy, 60, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 4; ctx.stroke();
                ctx.beginPath(); ctx.arc(moveStick.sx + moveStick.dx*60, moveStick.sy + moveStick.dy*60, 25, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
            }

            ctx.beginPath(); ctx.arc(aimStick.cx, aimStick.cy, aimStick.radius, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(aimStick.cx + aimStick.dx*aimStick.radius, aimStick.cy + aimStick.dy*aimStick.radius, 25, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();

            const drawBtn = (b, label, color, active) => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                ctx.fillStyle = active ? 'rgba(0, 255, 0, 0.5)' : (b.pressed ? 'rgba(255,0,0,0.6)' : color);
                ctx.fill(); ctx.strokeStyle = 'white'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = 'white'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
                ctx.fillText(label, b.x, b.y + 4);
            };
            drawBtn(btnFire, 'FIRE', 'rgba(255,0,0,0.4)', false);
            drawBtn(btnThrow, 'THROW', 'rgba(0,0,255,0.4)', false);
            drawBtn(btnExec, 'EXEC', 'rgba(255,165,0,0.4)', false);
            drawBtn(btnAuto, 'AUTO', 'rgba(100,100,100,0.4)', btnAuto.active);
            drawBtn(btnLook, 'LOOK', 'rgba(0,255,255,0.4)', false);
            drawBtn(btnRestart, 'R', 'rgba(255,255,255,0.2)', false);

            if (storyTimer > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, H/2 - 20, W, 40);
                ctx.fillStyle = 'white'; ctx.font = '20px Arial'; ctx.textAlign = 'center';
                ctx.fillText(storyText, W/2, H/2 + 5);
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        initLevel();
        gameLoop();
    </script>
</body>
</html>
