<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #111; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: canvas.width / 2, y: canvas.height / 2, size: 30, angle: 0 };
        let bullets = [];
        let enemy = { x: canvas.width / 2, y: 150, size: 30, health: 5, alive: true };

        // Плавающий левый джойстик (появляется при нажатии)
        let moveJoy = { active: false, id: null, startX: 0, startY: 0, curX: 0, curY: 0, angle: 0, dist: 0 };
        
        // Правый джойстик (фиксированный, для прицела)
        let aimJoy = { x: canvas.width - 120, y: canvas.height - 120, active: false, id: null, angle: 0, dist: 0 };
        
        // Кнопки как в порте: 1 (бить) и 3 (подобрать/выбросить)
        let btn1 = { x: canvas.width - 70, y: canvas.height - 200, radius: 35, pressed: false };
        let btn3 = { x: canvas.width - 150, y: canvas.height - 170, radius: 35, pressed: false };

        canvas.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                // Левая половина — плавающий джойстик
                if (touch.clientX < canvas.width / 2) {
                    if (!moveJoy.active) {
                        moveJoy.id = touch.identifier;
                        moveJoy.active = true;
                        moveJoy.startX = touch.clientX;
                        moveJoy.startY = touch.clientY;
                        moveJoy.curX = touch.clientX;
                        moveJoy.curY = touch.clientY;
                    }
                } 
                // Правая половина — проверка кнопок или прицел
                else {
                    // Кнопка 1 (Бить)
                    if (Math.hypot(touch.clientX - btn1.x, touch.clientY - btn1.y) < btn1.radius) {
                        btn1.pressed = true;
                        if (enemy.alive && Math.hypot(player.x - enemy.x, player.y - enemy.y) < 70) {
                            enemy.health -= 2;
                            if (enemy.health <= 0) enemy.alive = false;
                        }
                        continue;
                    }
                    // Кнопка 3 (Подобрать/Выбросить)
                    if (Math.hypot(touch.clientX - btn3.x, touch.clientY - btn3.y) < btn3.radius) {
                        btn3.pressed = true;
                        continue;
                    }
                    // Иначе правый джойстик (прицел)
                    if (!aimJoy.active) {
                        aimJoy.id = touch.identifier;
                        aimJoy.active = true;
                    }
                }
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveJoy.id) {
                    moveJoy.curX = touch.clientX;
                    moveJoy.curY = touch.clientY;
                    let dx = moveJoy.curX - moveJoy.startX;
                    let dy = moveJoy.curY - moveJoy.startY;
                    moveJoy.angle = Math.atan2(dy, dx);
                    moveJoy.dist = Math.min(Math.hypot(dx, dy), 60);
                    
                    if (moveJoy.dist > 15) {
                        player.x += Math.cos(moveJoy.angle) * 5;
                        player.y += Math.sin(moveJoy.angle) * 5;
                        player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
                        player.y = Math.max(20, Math.min(canvas.height - 20, player.y));
                    }
                }
                if (touch.identifier === aimJoy.id) {
                    let dx = touch.clientX - aimJoy.x;
                    let dy = touch.clientY - aimJoy.y;
                    aimJoy.angle = Math.atan2(dy, dx);
                    aimJoy.dist = Math.min(Math.hypot(dx, dy), 60);
                    
                    player.angle = aimJoy.angle;
                    if (aimJoy.dist > 15) {
                        shoot();
                    }
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === moveJoy.id) {
                    moveJoy.active = false;
                    moveJoy.id = null;
                    moveJoy.dist = 0;
                }
                if (touch.identifier === aimJoy.id) {
                    aimJoy.active = false;
                    aimJoy.id = null;
                    aimJoy.dist = 0;
                }
                btn1.pressed = false;
                btn3.pressed = false;
            }
        });

        let shootCooldown = 0;
        function shoot() {
            if (shootCooldown > 0) return;
            bullets.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(player.angle) * 15,
                vy: Math.sin(player.angle) * 15
            });
            shootCooldown = 8;
        }

        function gameLoop() {
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);

            if (shootCooldown > 0) shootCooldown--;

            // Враг
            if (enemy.alive) {
                ctx.fillStyle = '#d32f2f';
                ctx.fillRect(enemy.x - enemy.size/2, enemy.y - enemy.size/2, enemy.size, enemy.size);
                ctx.fillStyle = 'red';
                ctx.fillRect(enemy.x - 25, enemy.y - 30, enemy.health * 10, 5);
            } else {
                ctx.fillStyle = '#b71c1c';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, 40, 0, Math.PI * 2);
                ctx.fill();
            }

            // Игрок
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
            ctx.fillStyle = '#a67c52';
            ctx.fillRect(0, -player.size/4, player.size/2, player.size/2);
            ctx.restore();

            // Пули
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();

                if (enemy.alive && b.x > enemy.x - enemy.size/2 && b.x < enemy.x + enemy.size/2 &&
                    b.y > enemy.y - enemy.size/2 && b.y < enemy.y + enemy.size/2) {
                    enemy.health--;
                    if (enemy.health <= 0) enemy.alive = false;
                    bullets.splice(i, 1); 
                    continue;
                }
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // Рисуем левый джойстик (только если активен)
            if (moveJoy.active) {
                ctx.beginPath();
                ctx.arc(moveJoy.startX, moveJoy.startY, 60, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                let stickX = moveJoy.startX + Math.cos(moveJoy.angle) * moveJoy.dist;
                let stickY = moveJoy.startY + Math.sin(moveJoy.angle) * moveJoy.dist;
                ctx.beginPath();
                ctx.arc(stickX, stickY, 25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();
            }

            // Рисуем правый джойстик (всегда)
            ctx.beginPath();
            ctx.arc(aimJoy.x, aimJoy.y, 60, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 4;
            ctx.stroke();
            let astickX = aimJoy.x + Math.cos(aimJoy.angle) * aimJoy.dist;
            let astickY = aimJoy.y + Math.sin(aimJoy.angle) * aimJoy.dist;
            ctx.beginPath();
            ctx.arc(astickX, astickY, 25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();

            // Кнопка 1 (Бить)
            ctx.beginPath();
            ctx.arc(btn1.x, btn1.y, btn1.radius, 0, Math.PI * 2);
            ctx.fillStyle = btn1.pressed ? 'rgba(255,0,0,0.6)' : 'rgba(255,255,255,0.2)';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('1', btn1.x, btn1.y + 7);

            // Кнопка 3 (Подобрать/Выбросить)
            ctx.beginPath();
            ctx.arc(btn3.x, btn3.y, btn3.radius, 0, Math.PI * 2);
            ctx.fillStyle = btn3.pressed ? 'rgba(0,255,0,0.6)' : 'rgba(255,255,255,0.2)';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('3', btn3.x, btn3.y + 7);

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
